<style>
  :root{
    --bg-deep:#0A0C12;
    --bg-deep-2:#12151F;
    --glass:rgba(255,255,255,0.045);
    --glass-strong:rgba(255,255,255,0.07);
    --line:rgba(255,255,255,0.09);
    --ink:#F1EEE6;
    --sub:#9AA0AE;
    --amber:#FFC857;
    --amber-deep:#FF9F1C;
    --amber-soft:rgba(255,200,87,0.16);
    --violet:#8C7CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,159,28,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(140,124,255,0.08), transparent 55%),
      var(--bg-deep);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ---------- top brand bar ---------- */
  .app-top{
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
    padding:8px 14px 0;
    flex-shrink:0;
  }
  .app-top .inner{max-width:760px;margin:0 auto;}
  .brand-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    row-gap:4px;
    gap:8px;
    margin-bottom:6px;
  }
  .brand-text-block{min-width:0;flex:1 1 auto;}
  .share-app-btn{
    margin-left:auto;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--glass-strong);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:"Inter",sans-serif;
    font-size:12.5px;
    font-weight:600;
    width:30px;height:30px;
    padding:0;
    border-radius:50%;
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .share-app-btn:hover{
    border-color:rgba(255,200,87,0.5);
    box-shadow:0 0 0 3px rgba(255,200,87,0.1);
  }
  .share-app-btn svg{width:14px;height:14px;flex:0 0 auto;}
  .logo-wrap{
    position:relative;
    flex:0 0 auto;
    width:24px;height:24px;
  }
  .logo-glow{
    position:absolute;
    inset:-7px;
    background:radial-gradient(circle, rgba(255,200,87,0.55), transparent 70%);
    filter:blur(4px);
    animation:breathe 3.2s ease-in-out infinite;
    border-radius:50%;
  }
  .logo-wrap svg{position:relative;display:block;width:100%;height:100%;}
  @keyframes breathe{
    0%,100%{ opacity:.55; transform:scale(0.92); }
    50%{ opacity:1; transform:scale(1.08); }
  }
  .brand-text-block{min-width:0;}
  .app-eyebrow{
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:10px;
    color:var(--sub);
    font-weight:600;
    margin:0 0 2px;
  }
  .app-title{
    margin:0;
    font-family:"Sora","Inter",sans-serif;
    font-size:16px;
    font-weight:800;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg, #FFF6E0, var(--amber) 65%, var(--amber-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    max-width:760px;
    margin:0 auto;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .tab-btn{
    flex:0 0 auto;
    background:transparent;
    border:1px solid transparent;
    color:var(--sub);
    padding:6px 12px;
    font-size:12.5px;
    font-family:"Inter",sans-serif;
    font-weight:600;
    white-space:nowrap;
    border-radius:999px 999px 0 0;
    cursor:pointer;
    transition:color .15s ease;
  }
  .tab-btn.active{
    color:var(--ink);
    background:var(--glass-strong);
    border-color:var(--line);
    border-bottom-color:transparent;

<script>
  // ---------- tab switching ----------
  document.getElementById("tabs").addEventListener("click", function(e){
    var btn = e.target.closest(".tab-btn");
    if(!btn) return;
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    var target = btn.dataset.panel;
    document.querySelectorAll(".panel").forEach(function(p){
      p.classList.toggle("active", p.id === "panel-" + target);
    });
    if(target === "overview" && typeof window.__dlhRenderOverview === "function"){
      window.__dlhRenderOverview();
    }
    if(target === "counting" && typeof window.__dlhRenderCounting === "function"){
      window.__dlhRenderCounting();
    }
  });

  // ---------- del hele appen (som selvstændig HTML-fil) ----------
  document.getElementById("share-app-btn").addEventListener("click", async function(){
    var btn = this;
    var originalLabel = btn.innerHTML;
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

    try {
      // Prøv først den native del-menu (AirDrop, Teams, mail m.m.) — kræver iOS 16.4+
      // og at siden køres over https, ellers springes dette skridt automatisk over.
      if (typeof navigator.share === "function") {
        var shareBlob = new Blob([html], { type: "text/html" });
        var shareFile = new File([shareBlob], "den-lille-hjaelper.html", { type: "text/html" });
        var canShareFiles = typeof navigator.canShare === "function" && navigator.canShare({ files: [shareFile] });

        if (canShareFiles) {
          try {
            await navigator.share({
              files: [shareFile],
              title: "Den lille hjælper",
              text: "Her er værktøjet – åbn filen i en browser for at bruge det."
            });

=\"progress\">\n      <span>Opgaver udf\u00f8rt: <b id=\"prog-done\">0</b> / <b id=\"prog-total\">1</b></span>\n      <span class=\"afv-count\" id=\"prog-afv\">0 afventer</span>\n    </div>\n\n    <div class=\"section-title\">Opgaver</div>\n    <div id=\"points-items\">\n      <div class=\"item-card\" data-status=\"\" data-emne=\"Opgave\" data-krav=\"Beskrivelse\"><div class=\"item-head\"><div class=\"item-num\">1</div><div class=\"item-text\"><p class=\"item-emne is-placeholder\" contenteditable=\"true\" spellcheck=\"false\">Opgave</p><p class=\"item-krav is-placeholder\" contenteditable=\"true\" spellcheck=\"false\">Beskrivelse</p></div></div><div class=\"toggle\"><button type=\"button\" class=\"ok\">Udf\u00f8rt</button><button type=\"button\" class=\"afv\">Afventer</button></div><div class=\"detail\"><div class=\"field\"><label>Bem\u00e6rkning</label><textarea rows=\"2\"></textarea></div><div class=\"field\"><label>Ansvarlig</label><input type=\"text\"></div><div class=\"photo-row\"><div class=\"photo-box\"><span class=\"lbl\">Foto f\u00f8r</span><div class=\"photo-btn\"><label class=\"pick-btn cam-pick\"><span class=\"cam\">\ud83d\udcf7</span><span>Kamera</span><input type=\"file\" accept=\"image/*\" capture=\"environment\"></label><label class=\"pick-btn gal-pick\"><span class=\"cam\">\ud83d\uddbc\ufe0f</span><span>Galleri</span><input type=\"file\" accept=\"image/*\"></label></div></div><div class=\"photo-box\"><span class=\"lbl\">Foto efter</span><div class=\"photo-btn\"><label class=\"pick-btn cam-pick\"><span class=\"cam\">\ud83d\udcf7</span><span>Kamera</span><input type=\"file\" accept=\"image/*\" capture=\"environment\"></label><label class=\"pick-btn gal-pick\"><span class=\"cam\">\ud83d\uddbc\ufe0f</span><span>Galleri</span><input type=\"file\" accept=\"image/*\"></label></div></div></div></div></div>\n    </div>\n    <button class=\"add-extra\" id=\"add-point-btn\" type=\"button\">+ Tilf\u00f8j opgave</button>\n\n    <div class=\"section-title\">Bem\u00e6rkninger</div>\n    <div class=\"meta-card\">\n      <div class=\"field\">\n        <label>Generelle bem\u00e6rkninger</label>\n        <textarea id=\"m-bemaerk\" rows=\"4\" placeholder=\"Fx manglende afsk\u00e6rmninger, adgangsforhold m.m.\"></textarea>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"action-bar\">\n    <div class=\"inner\">\n      <button class=\"btn-primary\" id=\"show-report-btn\" type=\"button\">Vis rapport \u2192</button>\n    </div>\n  </div>\n</div>\n\n<div id=\"report\"></div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script>\n(function(){\n  \"use strict\";\n\n  // Gem den oprindelige, \"tomme\" side som en skabelon-streng, F\u00d8R vi r\u00f8rer DOM'en.\n  // Bruges senere til at bygge en selvst\u00e6ndig HTML-fil, n\u00e5r rapporten deles/sendes videre.\n  var ORIGINAL_HTML = document.documentElement.outerHTML;\n\n  var pointsWrap = document.getElementById(\"points-items\");\n  var pointCount = document.querySelectorAll(\"#points-items .item-card\").length;\n\n  function resizeImage(file, cb){\n    var reader = new FileReader();\n    reader.onload = function(e){\n      var img = new Image();\n      img.onload = function(){\n        var maxW = 900;\n        var scale = Math.min(1, maxW / img.width);\n        var canvas = document.createElement(\"canvas\");\n        canvas.width = img.width * scale;\n        canvas.height = img.height * scale;\n        var ctx = canvas.getContext(\"2d\");\n        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);\n        cb(canvas.toDataURL(\"image/jpeg\", 0.72));\n      };\n      img.src = e.target.result;\n    };\n    reader.readAsDataURL(file);\n  }\n\n  function wirePhotoInput(btn, input){\n    input.addEventListener(\"change\", function(){\n      if(!input.files || !input.files[0]) return;\n      resizeImage(input.files[0], function(dataUrl){ applyPhoto(btn, dataUrl); });\n    });\n  }\n\n  // Bygger de to sm\u00e5 valg-knapper \"Kamera\" / \"Galleri\" inde i en tom foto-slot.\n  // To adskilte <input>-felter bruges, fordi telefoners browsere er meget\n  // uens i hvordan de fortolker \u00e9t enkelt fil-felt \u2014 med denne opdeling er det\n  // altid entydigt, om man beder om kameraet eller telefonens billeder.\n  function resetPhotoBtn(btn){\n    btn.classList.remove(\"has-photo\");\n    btn.innerHTML =\n      '<label class=\"pick-btn cam-pick\"><span class=\"cam\">\ud83d\udcf7</span><span>Kamera</span></label>' +\n      '<label class=\"pick-btn gal-pick\"><span class=\"cam\">\ud83d\uddbc\ufe0f</span><span>Galleri</span></label>';\n\n    var camInput = document.createElement(\"input\");\n    camInput.type = \"file\";\n    camInput.accept = \"image/*\";\n    camInput.setAttribute(\"capture\", \"environment\");\n    btn.querySelector(\".cam-pick\").appendChild(camInput);\n    wirePhotoInput(btn, camInput);\n\n    var galInput = document.createElement(\"input\");\n    galInput.type = \"file\";\n    galInput.accept = \"image/*\";\n    btn.querySelector(\".gal-pick\").appendChild(galInput);\n    wirePhotoInput(btn, galInput);\n\n    delete btn.dataset.photo;\n  }\n\n  function applyPhoto(btn, dataUrl){\n    btn.classList.add(\"has-photo\");\n    btn.innerHTML = \"\";\n    var img = document.createElement(\"img\");\n    img.src = dataUrl;\n    btn.appendChild(img);\n\n    var actions = document.createElement(\"span\");\n    actions.className = \"photo-actions\";\n\n    var change = document.createElement(\"span\");\n    change.className = \"retake\";\n    change.textContent = \"\u2715 Skift/fjern foto\";\n    change.addEventListener(\"click\", function(e){\n      e.preventDefault();\n      e.stopPropagation();\n      resetPhotoBtn(btn);\n    });\n    actions.appendChild(change);\n\n    btn.appendChild(actions);\n    btn.dataset.photo = dataUrl;\n  }\n\n  function photoBox(labelText){\n    var box = document.createElement(\"div\");\n    box.className = \"photo-box\";\n    var lbl = document.createElement(\"span\");\n    lbl.className = \"lbl\";\n    lbl.textContent = labelText;\n    var btn = document.createElement(\"div\");\n    btn.className = \"photo-btn\";\n    resetPhotoBtn(btn);\n    box.appendChild(lbl);\n    box.appendChild(btn);\n    return box;\n  }\n\n  // Kobler klik/foto-adf\u00e6rd p\u00e5 et allerede eksisterende (statisk) punkt-kort,\n  // dvs. de 17 faste kort som ligger direkte i HTML'en fra start.\n  function wireToggle(card){\n    var okBtn = card.querySelector(\".toggle .ok\");\n    var afvBtn = card.querySelector(\".toggle .afv\");\n    function setStatus(s){\n      card.dataset.status = s;\n      okBtn.classList.toggle(\"active\", s === \"OK\");\n      afvBtn.classList.toggle(\"active\", s === \"AFV\");\n      card.classList.toggle(\"is-afv\", s === \"AFV\");\n      card.classList.toggle(\"is-done\", s === \"OK\");\n      updateProgress();\n    }\n    okBtn.addEventListener(\"click\", function(){ setStatus(card.dataset.status === \"OK\" ? \"\" : \"OK\"); });\n    afvBtn.addEventListener(\"click\", function(){ setStatus(card.dataset.status === \"AFV\" ? \"\" : \"AFV\"); });\n  }\n\n  function enhanceStaticCard(card){\n    wireToggle(card);\n    wireEditableTitle(card);\n    addDeleteButton(card);\n    // Kobler klik-adf\u00e6rd p\u00e5 de allerede statisk tilstedev\u00e6rende kamera/galleri-knapper\n    card.querySelectorAll(\".photo-btn\").forEach(function(btn){\n      btn.querySelectorAll(\"input[type=file]\").forEach(function(input){\n        wirePhotoInput(btn, input);\n      });\n    });\n  }\n\n  // G\u00f8r emne/krav-teksten p\u00e5 et punkt redigerbar direkte i listen, og holder\n  // data-emne/data-krav synkroniseret (bruges n\u00e5r rapporten gemmes/deles).\n  // Tomme punkter viser en lys \"placeholder\"-tekst, der markeres automatisk,\n  // s\u00e5 man bare kan begynde at skrive for at erstatte den.\n  var PLACEHOLDER_EMNE = \"Opgave\";\n  var PLACEHOLDER_KRAV = \"Beskrivelse\";\n\n  function wireEditableTitle(card){\n    var emneEl = card.querySelector(\".item-emne\");\n    var kravEl = card.querySelector(\".item-krav\");\n    [emneEl, kravEl].forEach(function(el){\n      if(!el) return;\n      el.addEventListener(\"focus\", function(){\n        if(el.classList.contains(\"is-placeholder\")){\n          var range = document.createRange();\n          range.selectNodeContents(el);\n          var sel = window.getSelection();\n          sel.removeAllRanges();\n          sel.addRange(range);\n        }\n      });\n      el.addEventListener(\"input\", function(){\n        el.classList.remove(\"is-placeholder\");\n        card.dataset.emne = emneEl ? emneEl.textContent.trim() : \"\";\n        card.dataset.krav = kravEl ? kravEl.textContent.trim() : \"\";\n      });\n      el.addEventListener(\"keydown\", function(e){\n        if(e.key === \"Enter\"){\n          e.preventDefault();\n          el.blur();\n        }\n      });\n      el.addEventListener(\"blur\", function(){\n        if(!el.textContent.trim()){\n          el.textContent = el === emneEl ? PLACEHOLDER_EMNE : PLACEHOLDER_KRAV;\n          el.classList.add(\"is-placeholder\");\n          card.dataset.emne = emneEl ? emneEl.textContent.trim() : \"\";\n          card.dataset.krav = kravEl ? kravEl.textContent.trim() : \"\";\n        }\n      });\n    });\n  }\n\n  // Bygger et nyt, tomt punkt (bruges ved \"+ Tilf\u00f8j punkt\" og ved genindl\u00e6sning af delte rapporter)\n  function buildPointCard(num){\n    var card = document.createElement(\"div\");\n    card.className = \"item-card\";\n    card.dataset.status = \"\";\n    card.dataset.emne = \"\";\n    card.dataset.krav = \"\";\n\n    var head = document.createElement(\"div\");\n    head.className = \"item-head\";\n\n    var numEl = document.createElement(\"div\");\n    numEl.className = \"item-num\";\n    numEl.textContent = num;\n    head.appendChild(numEl);\n\n    var textWrap = document.createElement(\"div\");\n    textWrap.className = \"item-text\";\n\n    var emneP = document.createElement(\"p\");\n    emneP.className = \"item-emne is-placeholder\";\n    emneP.contentEditable = \"true\";\n    emneP.spellcheck = false;\n    emneP.textContent = PLACEHOLDER_EMNE;\n\n    var kravP = document.createElement(\"p\");\n    kravP.className = \"item-krav is-placeholder\";\n    kravP.contentEditable = \"true\";\n    kravP.spellcheck = false;\n    kravP.textContent = PLACEHOLDER_KRAV;\n\n    textWrap.appendChild(emneP);\n    textWrap.appendChild(kravP);\n    head.appendChild(textWrap);\n    card.appendChild(head);\n\n    var toggle = document.createElement(\"div\");\n    toggle.className = \"toggle\";\n    var okBtn = document.createElement(\"button\");\n    okBtn.type = \"button\"; okBtn.className = \"ok\"; okBtn.textContent = \"Udf\u00f8rt\";\n    var afvBtn = document.createElement(\"button\");\n    afvBtn.type = \"button\"; afvBtn.className = \"afv\"; afvBtn.textContent = \"Afventer\";\n    toggle.appendChild(okBtn); toggle.appendChild(afvBtn);\n    card.appendChild(toggle);\n\n    var detail = document.createElement(\"div\");\n    detail.className = \"detail\";\n\n    var anmField = document.createElement(\"div\");\n    anmField.className = \"field\";\n    anmField.innerHTML = '<label>Bem\u00e6rkning</label>';\n    var anmTextarea = document.createElement(\"textarea\");\n    anmTextarea.rows = 2;\n    anmField.appendChild(anmTextarea);\n\n    var ansvField = document.createElement(\"div\");\n    ansvField.className = \"field\";\n    ansvField.innerHTML = '<label>Ansvarlig</label>';\n    var ansvInput = document.createElement(\"input\");\n    ansvInput.type = \"text\";\n    ansvField.appendChild(ansvInput);\n\n    detail.appendChild(anmField);\n    detail.appendChild(ansvField);\n\n    var photoRow = document.createElement(\"div\");\n    photoRow.className = \"photo-row\";\n    photoRow.appendChild(photoBox(\"Foto f\u00f8r\"));\n    photoRow.appendChild(photoBox(\"Foto efter\"));\n    detail.appendChild(photoRow);\n\n    card.appendChild(detail);\n\n    addDeleteButton(card);\n    wireToggle(card);\n    wireEditableTitle(card);\n    return card;\n  }\n\n  // Nummererer punkterne 1, 2, 3 ... igen efter et punkt er tilf\u00f8jet eller slettet.\n  function renumberPoints(){\n    document.querySelectorAll(\"#points-items .item-card\").forEach(function(card, i){\n      var numEl = card.querySelector(\".item-num\");\n      if(numEl) numEl.textContent = i + 1;\n    });\n  }\n  // Tilf\u00f8jer en \"\u2715 Slet punkt\"-knap til et kort.\n  function addDeleteButton(card){\n    var delBtn = document.createElement(\"button\");\n    delBtn.type = \"button\";\n    delBtn.className = \"delete-extra\";\n    delBtn.textContent = \"\u2715 Slet opgave\";\n    delBtn.addEventListener(\"click\", function(){\n      card.remove();\n      renumberPoints();\n      updateProgress();\n    });\n    card.appendChild(delBtn);\n  }\n\n  // Det f\u00f8rste punkt ligger allerede som statisk HTML (s\u00e5 det altid er synligt,\n  // ogs\u00e5 hvis en mail-app viser filen i en forh\u00e5ndsvisning uden JavaScript) \u2014\n  // her kobler vi blot interaktiviteten p\u00e5 det.\n  document.querySelectorAll(\"#points-items .item-card\").forEach(enhanceStaticCard);\n\n  // G\u00f8r firmanavn, titel og undertekst i headeren redigerbare direkte i toppen af siden.\n  function wireEditableHeader(){\n    [\"hdr-eyebrow\", \"hdr-title\", \"hdr-note\"].forEach(function(id){\n      var el = document.getElementById(id);\n      if(!el) return;\n      el.addEventListener(\"keydown\", function(e){\n        if(e.key === \"Enter\"){\n          e.preventDefault();\n          el.blur();\n        }\n      });\n    });\n  }\n  wireEditableHeader();\n\n  document.getElementById(\"add-point-btn\").addEventListener(\"click\", function(){\n    pointCount++;\n    var card = buildPointCard(pointCount);\n    pointsWrap.appendChild(card);\n    var emneEl = card.querySelector(\".item-emne\");\n    if(emneEl) emneEl.focus();\n  });\n\n  function updateProgress(){\n    var cards = document.querySelectorAll(\".item-card\");\n    var done = 0, afv = 0;\n    cards.forEach(function(c){\n      if(c.dataset.status){ done++; }\n      if(c.dataset.status === \"AFV\"){ afv++; }\n    });\n    document.getElementById(\"prog-done\").textContent = done;\n    document.getElementById(\"prog-total\").textContent = document.querySelectorAll(\"#points-items .item-card\").length;\n    document.getElementById(\"prog-afv\").textContent = afv + \" afventer\";\n  }\n  updateProgress();\n\n  // default date = today\n  var dateEl = document.getElementById(\"m-dato\");\n  var today = new Date();\n  dateEl.value = today.toISOString().slice(0,10);\n\n  // ---------- tidsregistrering & flex-beregning ----------\n  function hoursToStr(h){\n    if(isNaN(h)) return \"\u2014\";\n    var sign = h < 0 ? \"-\" : \"\";\n    var abs = Math.abs(h);\n    var whole = Math.floor(abs);\n    var mins = Math.round((abs - whole) * 60);\n    if(mins === 60){ whole++; mins = 0; }\n    return sign + whole + \"t \" + (mins < 10 ? \"0\" + mins : mins) + \"m\";\n  }\n\n  function parseTimeToMinutes(val){\n    if(!val) return null;\n    var parts = val.split(\":\");\n    if(parts.length < 2) return null;\n    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);\n    if(isNaN(h) || isNaN(m)) return null;\n    return h * 60 + m;\n  }\n\n  var elStart = document.getElementById(\"t-start\");\n  var elSlut = document.getElementById(\"t-slut\");\n  var elTotal = document.getElementById(\"t-total\");\n  var elNorm = document.getElementById(\"f-norm\");\n  var elForrige = document.getElementById(\"f-forrige\");\n  var elDiff = document.getElementById(\"f-diff\");\n  var elNy = document.getElementById(\"f-ny\");\n\n  var lastTotalHours = 0;\n  var lastFlexDiffHours = null;\n  var lastFlexNyHours = null;\n\n  function recalcTime(){\n    var startMin = parseTimeToMinutes(elStart.value);\n    var slutMin = parseTimeToMinutes(elSlut.value);\n\n    if(startMin === null || slutMin === null){\n      elTotal.value = \"\u2014\";\n      lastTotalHours = 0;\n      recalcFlex();\n      return;\n    }\n    var diffMin = slutMin - startMin;\n    if(diffMin < 0) diffMin += 24 * 60; // arbejde hen over midnat\n    if(diffMin < 0) diffMin = 0;\n    lastTotalHours = diffMin / 60;\n    elTotal.value = hoursToStr(lastTotalHours);\n    recalcFlex();\n  }\n\n  function recalcFlex(){\n    var norm = parseFloat(elNorm.value);\n    var forrige = parseFloat(elForrige.value);\n    if(isNaN(norm)){\n      elDiff.value = \"\u2014\"; elNy.value = \"\u2014\";\n      lastFlexDiffHours = null; lastFlexNyHours = null;\n      return;\n    }\n    var diff = lastTotalHours - norm;\n    elDiff.value = hoursToStr(diff);\n    lastFlexDiffHours = diff;\n    if(!isNaN(forrige)){\n      elNy.value = hoursToStr(forrige + diff);\n      lastFlexNyHours = forrige + diff;\n    } else {\n      elNy.value = \"\u2014\";\n      lastFlexNyHours = null;\n    }\n  }\n\n  [elStart, elSlut].forEach(function(el){\n    el.addEventListener(\"input\", recalcTime);\n    el.addEventListener(\"change\", recalcTime);\n  });\n  [elNorm, elForrige].forEach(function(el){\n    el.addEventListener(\"input\", recalcFlex);\n    el.addEventListener(\"change\", recalcFlex);\n  });\n  recalcTime();\n\n  // ---------- gem/indl\u00e6s hele formularens tilstand (bruges ved deling til administration) ----------\n  function serializeState(){\n    var items = [];\n    document.querySelectorAll(\"#points-items .item-card\").forEach(function(card){\n      var anmTextarea = card.querySelector(\".detail textarea\");\n      var ansvInput = card.querySelector(\".detail input[type=text]\");\n      var photoBtns = card.querySelectorAll(\".photo-btn\");\n      items.push({\n        emne: card.dataset.emne || \"\",\n        krav: card.dataset.krav || \"\",\n        status: card.dataset.status || \"\",\n        anmaerkning: anmTextarea ? anmTextarea.value : \"\",\n        ansvarlig: ansvInput ? ansvInput.value : \"\",\n        fotoFor: photoBtns[0] ? (photoBtns[0].dataset.photo || null) : null,\n        fotoEfter: photoBtns[1] ? (photoBtns[1].dataset.photo || null) : null\n      });\n    });\n    return {\n      meta: {\n        montor: document.getElementById(\"m-montor\").value,\n        dato: document.getElementById(\"m-dato\").value,\n        bemaerk: document.getElementById(\"m-bemaerk\").value,\n        tidStart: document.getElementById(\"t-start\").value,\n        tidSlut: document.getElementById(\"t-slut\").value,\n        tidTotal: document.getElementById(\"t-total\").value,\n        flexNorm: document.getElementById(\"f-norm\").value,\n        flexForrige: document.getElementById(\"f-forrige\").value,\n        flexDiff: document.getElementById(\"f-diff\").value,\n        flexNy: document.getElementById(\"f-ny\").value,\n        tidTotalHours: lastTotalHours,\n        flexDiffHours: lastFlexDiffHours,\n        flexNyHours: lastFlexNyHours\n      },\n      header: {\n        eyebrow: (document.getElementById(\"hdr-eyebrow\") && document.getElementById(\"hdr-eyebrow\").textContent.trim()) || \"\",\n        title: (document.getElementById(\"hdr-title\") && document.getElementById(\"hdr-title\").textContent.trim()) || \"\",\n        note: (document.getElementById(\"hdr-note\") && document.getElementById(\"hdr-note\").textContent.trim()) || \"\"\n      },\n      items: items,\n      savedAt: new Date().toISOString()\n    };\n  }\n\n  function deserializeState(data){\n    if(!data || !data.meta) return;\n    document.getElementById(\"m-montor\").value = data.meta.montor || \"\";\n    document.getElementById(\"m-dato\").value = data.meta.dato || \"\";\n    document.getElementById(\"m-bemaerk\").value = data.meta.bemaerk || \"\";\n    if(data.meta.tidStart) document.getElementById(\"t-start\").value = data.meta.tidStart;\n    if(data.meta.tidSlut) document.getElementById(\"t-slut\").value = data.meta.tidSlut;\n    if(data.meta.flexNorm) document.getElementById(\"f-norm\").value = data.meta.flexNorm;\n    if(data.meta.flexForrige !== undefined && data.meta.flexForrige !== \"\") document.getElementById(\"f-forrige\").value = data.meta.flexForrige;\n    recalcTime();\n\n    if(data.header){\n      var eyebrowEl = document.getElementById(\"hdr-eyebrow\");\n      var titleEl = document.getElementById(\"hdr-title\");\n      var noteEl = document.getElementById(\"hdr-note\");\n      if(eyebrowEl && data.header.eyebrow) eyebrowEl.textContent = data.header.eyebrow;\n      if(titleEl && data.header.title) titleEl.textContent = data.header.title;\n      if(noteEl && data.header.note) noteEl.textContent = data.header.note;\n    }\n\n    // Der er ingen fast tjekliste i denne skabelon \u2014 ryd punktlisten helt,\n    // og genopbyg den pr\u00e6cist som den s\u00e5 ud, da rapporten blev gemt/delt.\n    pointsWrap.innerHTML = \"\";\n    pointCount = 0;\n\n    (data.items || []).forEach(function(itemData){\n      pointCount++;\n      var card = buildPointCard(pointCount);\n      pointsWrap.appendChild(card);\n\n      var emneEl = card.querySelector(\".item-emne\");\n      var kravEl = card.querySelector(\".item-krav\");\n      if(emneEl && itemData.emne){\n        emneEl.textContent = itemData.emne;\n        emneEl.classList.remove(\"is-placeholder\");\n      }\n      if(kravEl && itemData.krav){\n        kravEl.textContent = itemData.krav;\n        kravEl.classList.remove(\"is-placeholder\");\n      }\n      card.dataset.emne = itemData.emne || \"\";\n      card.dataset.krav = itemData.krav || \"\";\n\n      if(itemData.status){\n        var okBtn = card.querySelector(\".toggle .ok\");\n        var afvBtn = card.querySelector(\".toggle .afv\");\n        card.dataset.status = itemData.status;\n        okBtn.classList.toggle(\"active\", itemData.status === \"OK\");\n        afvBtn.classList.toggle(\"active\", itemData.status === \"AFV\");\n        card.classList.toggle(\"is-afv\", itemData.status === \"AFV\");\n        card.classList.toggle(\"is-done\", itemData.status === \"OK\");\n      }\n      var anmTextarea = card.querySelector(\".detail textarea\");\n      if(anmTextarea) anmTextarea.value = itemData.anmaerkning || \"\";\n      var ansvInput = card.querySelector(\".detail input[type=text]\");\n      if(ansvInput) ansvInput.value = itemData.ansvarlig || \"\";\n\n      var photoBtns = card.querySelectorAll(\".photo-btn\");\n      if(itemData.fotoFor && photoBtns[0]) applyPhoto(photoBtns[0], itemData.fotoFor);\n      if(itemData.fotoEfter && photoBtns[1]) applyPhoto(photoBtns[1], itemData.fotoEfter);\n    });\n    updateProgress();\n  }\n\n  function showLoadedBanner(data){\n    var el = document.getElementById(\"loaded-banner\");\n    var txt = document.getElementById(\"loaded-banner-text\");\n    if(!el || !txt) return;\n    var when = \"\";\n    try{ when = new Date(data.savedAt).toLocaleString(\"da-DK\"); }catch(e){}\n    txt.textContent = \"Modtaget fra \" + (data.meta.montor || \"mont\u00f8r\") + (when ? \" \u00b7 \" + when : \"\") +\n      \". Ret felterne nedenfor efter behov, og del rapporten igen n\u00e5r den er godkendt.\";\n    el.style.display = \"block\";\n  }\n\n  // Bygger en ny, selvst\u00e6ndig HTML-fil med den aktuelle rapport indlejret.\n  // Filen er 100% selvk\u00f8rende \u2014 modtageren kan \u00e5bne den direkte i en browser\n  // og se/redigere hele rapporten, uden internet eller app.\n  function buildExportHtml(){\n    var state = serializeState();\n    var json = JSON.stringify(state);\n    var closeTag = \"</\" + \"body>\";\n    var stateScript = \"<\" + \"script>try{window.__loadReportState && window.__loadReportState(\" +\n      json + \");}catch(e){console.error(e);}</\" + \"script>\";\n    // Brug SIDSTE forekomst af </body> \u2014 vores egen kildekode kan indeholde teksten\n    // \"</body>\" som en streng, s\u00e5 en almindelig .replace() kan ramme forkert sted.\n    var idx = ORIGINAL_HTML.lastIndexOf(closeTag);\n    var html = idx === -1\n      ? ORIGINAL_HTML + stateScript\n      : ORIGINAL_HTML.slice(0, idx) + stateScript + ORIGINAL_HTML.slice(idx);\n    return \"<!DOCTYPE html>\\n\" + html;\n  }\n\n  function exportToExcel(meta, cards){\n    if(typeof XLSX === \"undefined\"){\n      alert(\"Excel-eksport kunne ikke indl\u00e6ses. Tjek din internetforbindelse og pr\u00f8v igen.\");\n      return;\n    }\n    var rapportRows = [\n      [\"Opgave- og tidsrapport\"],\n      [],\n      [\"Medarbejder\", meta.montor || \"\"],\n      [\"Dato\", meta.dato || \"\"],\n      [],\n      [\"Tidsregistrering\"],\n      [\"M\u00f8detid\", meta.tidStart || \"\"],\n      [\"Sluttid\", meta.tidSlut || \"\"],\n      [\"Arbejdstid i alt\", meta.tidTotal || \"\"],\n      [],\n      [\"Flex-overblik\"],\n      [\"Normtid pr. dag (t)\", meta.flexNorm || \"\"],\n      [\"Flexsaldo, forrige (t)\", meta.flexForrige || \"\"],\n      [\"Flex i dag\", meta.flexDiff || \"\"],\n      [\"Ny flexsaldo\", meta.flexNy || \"\"],\n      [],\n      [\"Generelle bem\u00e6rkninger\"],\n      [meta.bemaerk || \"\"]\n    ];\n\n    var opgaveRows = [[\"#\", \"Opgave\", \"Beskrivelse\", \"Status\", \"Bem\u00e6rkning\", \"Ansvarlig\"]];\n    cards.forEach(function(card, idx){\n      var status = card.dataset.status;\n      var statusLabel = status === \"AFV\" ? \"Afventer\" : (status === \"OK\" ? \"Udf\u00f8rt\" : \"Ikke udfyldt\");\n      var anm = card.querySelector(\".detail textarea\") ? card.querySelector(\".detail textarea\").value : \"\";\n      var ansv = card.querySelector(\".detail input[type=text]\") ? card.querySelector(\".detail input[type=text]\").value : \"\";\n      opgaveRows.push([\n        idx + 1,\n        card.dataset.emne || \"\",\n        card.dataset.krav || \"\",\n        statusLabel,\n        anm,\n        ansv\n      ]);\n    });\n\n    var wb = XLSX.utils.book_new();\n    var wsRapport = XLSX.utils.aoa_to_sheet(rapportRows);\n    wsRapport[\"!cols\"] = [{wch:24},{wch:36}];\n    XLSX.utils.book_append_sheet(wb, wsRapport, \"Rapport\");\n\n    var wsOpgaver = XLSX.utils.aoa_to_sheet(opgaveRows);\n    wsOpgaver[\"!cols\"] = [{wch:4},{wch:22},{wch:36},{wch:12},{wch:30},{wch:18}];\n    XLSX.utils.book_append_sheet(wb, wsOpgaver, \"Opgaver\");\n\n    XLSX.writeFile(wb, makeFileName(meta, null, \"xlsx\"));\n  }\n\n  function makeFileName(meta, suffix, ext){\n    var navn = (meta.montor || \"medarbejder\").trim().replace(/[^a-zA-Z0-9\u00e6\u00f8\u00e5\u00c6\u00d8\u00c5]+/g, \"_\");\n    var dato = meta.dato || new Date().toISOString().slice(0,10);\n    return \"Rapport_\" + navn + \"_\" + dato + (suffix ? \"_\" + suffix : \"\") + \".\" + (ext || \"html\");\n  }\n\n  // Kaldes automatisk, hvis filen er \u00e5bnet med en indlejret rapport (dvs. modtaget fra en kollega/mont\u00f8r)\n  window.__loadReportState = function(data){\n    deserializeState(data);\n    document.getElementById(\"report\").style.display = \"none\";\n    document.getElementById(\"form-view\").style.display = \"block\";\n    showLoadedBanner(data);\n    window.scrollTo(0,0);\n  };\n\n  // Bruges af den omkringliggende app til at hente/gemme rapportens data ifm. enheds-synkronisering\n  window.__getReportState = function(){ return serializeState(); };\n  window.__setReportState = function(data){ deserializeState(data); };\n\n  // Fjerner opgaver markeret \"Udf\u00f8rt\" fra formularen - bruges af den\n  // omkringliggende app lige efter \"Gem\"-knappen har logget dagens\n  // opgaver til Opgaveoverblikkets historik, s\u00e5 de f\u00e6rdige opgaver ikke\n  // ved et uheld bliver liggende og gemt igen (og dermed talt dobbelt)\n  // under en senere dato. \"Afventer\"-opgaver bliver st\u00e5ende.\n  window.__clearCompletedItems = function(){\n    document.querySelectorAll(\"#points-items .item-card\").forEach(function(card){\n      if(card.dataset.status === \"OK\") card.remove();\n    });\n    renumberPoints();\n    updateProgress();\n    return serializeState();\n  };\n\n  // ---------- report generation ----------\n  function esc(s){\n    var d = document.createElement(\"div\");\n    d.textContent = s || \"\";\n    return d.innerHTML;\n  }\n\n  document.getElementById(\"show-report-btn\").addEventListener(\"click\", function(){\n    var meta = {\n      montor: document.getElementById(\"m-montor\").value,\n      dato: document.getElementById(\"m-dato\").value,\n      bemaerk: document.getElementById(\"m-bemaerk\").value,\n      tidStart: document.getElementById(\"t-start\").value,\n      tidSlut: document.getElementById(\"t-slut\").value,\n      tidTotal: document.getElementById(\"t-total\").value,\n      flexNorm: document.getElementById(\"f-norm\").value,\n      flexForrige: document.getElementById(\"f-forrige\").value,\n      flexDiff: document.getElementById(\"f-diff\").value,\n      flexNy: document.getElementById(\"f-ny\").value\n    };\n\n    var cards = document.querySelectorAll(\".item-card\");\n    var itemsHtml = \"\";\n    var total = cards.length, afvTotal = 0, doneTotal = 0;\n\n    cards.forEach(function(card, idx){\n      var status = card.dataset.status;\n      if(status){ doneTotal++; }\n      if(status === \"AFV\"){ afvTotal++; }\n      var emne = card.dataset.emne || \"(uden opgavenavn)\";\n      var krav = card.dataset.krav || \"(uden beskrivelse)\";\n      var statusLabel = status === \"AFV\" ? \"Afventer\" : (status === \"OK\" ? \"Udf\u00f8rt\" : \"\");\n      var tagHtml = status\n        ? '<span class=\"tag ' + (status === \"AFV\" ? \"afv\" : \"ok\") + '\">' + statusLabel + '</span>'\n        : '<span class=\"tag\" style=\"background:#eee;color:#888;\">Ikke udfyldt</span>';\n\n      var anm = card.querySelector(\".detail textarea\") ? card.querySelector(\".detail textarea\").value : \"\";\n      var ansv = card.querySelector(\".detail input[type=text]\") ? card.querySelector(\".detail input[type=text]\").value : \"\";\n      var photoBtns = card.querySelectorAll(\".photo-btn\");\n      var forData = photoBtns[0] ? photoBtns[0].dataset.photo : null;\n      var efterData = photoBtns[1] ? photoBtns[1].dataset. n        '<div class=\"report-body\">' +\n          '<div class=\"meta-grid\">' +\n            '<div><span>Medarbejder</span><b>' + esc(meta.montor) + '</b></div>' +\n            '<div><span>Dato</span><b>' + esc(meta.dato) + '</b></div>' +\n          '</div>' +\n          '<div class=\"section-title\">Tidsregistrering &amp; flex</div>' +\n          '<div class=\"meta-grid\">' +\n            '<div><span>M\u00f8detid</span><b>' + esc(meta.tidStart || \"\u2014\") + '</b></div>' +\n            '<div><span>Sluttid</span><b>' + esc(meta.tidSlut || \"\u2014\") + '</b></div>' +\n            '<div><span>Arbejdstid i alt</span><b>' + esc(meta.tidTotal || \"\u2014\") + '</b></div>' +\n            '<div><span>Normtid</span><b>' + esc(meta.flexNorm || \"\u2014\") + ' t</b></div>' +\n            '<div><span>Flex i dag</span><b>' + esc(meta.flexDiff || \"\u2014\") + '</b></div>' +\n            '<div><span>Flexsaldo, forrige</span><b>' + esc(meta.flexForrige || \"0\") + ' t</b></div>' +\n            '<div><span>Ny flexsaldo</span><b>' + esc(meta.flexNy || \"\u2014\") + '</b></div>' +\n          '</div>' +\n          '<div class=\"section-title\" style=\"margin-top:20px;\">Opgaver</div>' +\n          itemsHtml +\n          (meta.bemaerk ? '<div class=\"section-title\" style=\"margin-top:20px;\">Bem\u00e6rkninger</div><div class=\"r-remarks\">' + esc(meta.bemaerk) + '</div>' : '') +\n          '<div class=\"r-sign\">Rapport udfyldt af ' + esc(meta.montor || \"\u2014\") + ' \u00b7 ' + esc(meta.dato) + '</div>' +\n          '<div class=\"report-actions\">' +\n            '<button class=\"btn-primary\" id=\"share-btn\" type=\"button\">\ud83d\udce5 Gem rapport-fil (til deling)</button>' +\n            '<div class=\"report-actions-row\">' +\n              '<button class=\"btn-secondary\" id=\"back-btn\" type=\"button\">\u2190 Rediger</button>' +\n              '<button class=\"btn-secondary\" id=\"print-btn\" type=\"button\">Print / Gem PDF</button>' +\n            '</div>' +\n            '<div class=\"report-actions-row\">' +\n              '<button class=\"btn-secondary\" id=\"excel-btn\" type=\"button\">\ud83d\udcca Eksport\u00e9r til Excel</button>' +\n            '</div>' +\n            '<div id=\"share-confirm\" class=\"share-confirm\" style=\"display:none;\"></div>' +\n            '<p class=\"share-note\">Gemmer filen p\u00e5 telefonen, s\u00e5 du kan vedh\u00e6fte den i en mail, Teams eller besked til administration.</p>' +\n          '</div>' +\n        '</div>' +\n      '</div>';\n\n    document.getElementById(\"report\").innerHTML = reportHtml;\n    document.getElementById(\"form-view\").style.display = \"none\";\n    document.getElementById(\"report\").style.display = \"block\";\n    window.scrollTo(0,0);\n\n    document.getElementById(\"excel-btn\").addEventListener(\"click\", function(){\n      exportToExcel(meta, cards);\n    });\n\n    document.getElementById(\"back-btn\").addEventListener(\"click\", function(){\n      document.getElementById(\"report\").style.display = \"none\";\n      document.getElementById(\"form-view\").style.display = \"block\";\n    });\n    document.getElementById(\"print-btn\").addEventListener(\"click\", function(){\n      window.print();\n    });\n\n    document.getElementById(\"share-btn\").addEventListener(\"click\", function(){\n      var filename = makeFileName(meta);\n      var html = buildExportHtml();\n      var blob = new Blob([html], {type:\"application/octet-stream\"});\n\n      // Download er den p\u00e5lidelige metode \u2014 virker altid, uanset om telefonens\n      // Del-menu underst\u00f8tter at vedh\u00e6fte HTML-filer i Mail/Beskeder eller ej.\n      var url = URL.createObjectURL(blob);\n      var a = document.createElement(\"a\");\n      a.href = url; a.download = filename;\n      document.body.appendChild(a);\n      a.click();\n      document.body.removeChild(a);\n      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);\n\n      var confirmBox = document.getElementById(\"share-confirm\");\n      confirmBox.innerHTML =\n        '<p><strong>\u2705 Filen er gemt p\u00e5 telefonen</strong><br>' +\n        'Navn: <code>' + esc(filename) + '</code></p>' +\n        '<p>S\u00e5dan sender du den videre:</p>' +\n        '<ol>' +\n          '<li>\u00c5bn din mail-, Teams- eller besked-app</li>' +\n          '<li>Opret en ny besked til administrationen</li>' +\n          '<li>Tryk p\u00e5 papirklip/vedh\u00e6ft-ikonet \u2192 v\u00e6lg filen (den ligger under \"Filer\" eller \"Downloads\")</li>' +\n        '</ol>' +\n        '<button class=\"btn-secondary\" id=\"try-share-btn\" type=\"button\" style=\"width:100%;margin-top:4px;\">\ud83d\udce4 Pr\u00f8v i stedet: Del-menu (fx AirDrop/Teams)</button>';\n      confirmBox.style.display = \"block\";\n\n      var tryShareBtn = document.getElementById(\"try-share-btn\");\n      tryShareBtn.addEventListener(\"click\", async function(){\n        try{\n          var file = new File([blob], filename, {type:\"application/octet-stream\"});\n          if(navigator.canShare && navigator.canShare({files:[file]})){\n            await navigator.share({\n              files:[file],\n              title:\"Servicerapport\",\n              text:\"Opgave- og tidsrapport til gennemgang\" + (meta.montor ? \" \u2013 \" + meta.montor : \"\") + (meta.dato ? \" (\" + meta.dato + \")\" : \"\")\n            });\n          } else {\n            alert(\"Del-menu med filvedh\u00e6ftning underst\u00f8ttes ikke af denne browser. Brug fremgangsm\u00e5den ovenfor i stedet.\");\n          }\n        }catch(err){\n          if(!(err && err.name === \"AbortError\")){\n            alert(\"Del-menuen kunne ikke \u00e5bnes. Brug fremgangsm\u00e5den ovenfor i stedet.\");\n          }\n        }\n      });\n    });\n  });\n})();\n<\/script>\n</body>\n</html>\n";
  var reportFrame = document.getElementById("report-frame");

        var active = reportFrame.contentDocument && reportFrame.contentDocument.activeElement;
        var isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);
        if (!isTyping) pullState(false);
      }, 20000);
    }

    async function connectWithCode(code) {
      syncCode = code.trim();
      if (!syncCode) return;
      localStorage.setItem(LS_CODE_KEY, syncCode);
      renderConnectionUI();
      setStatus("Forbinder...");
      await pullState(true);
      // slår denne enheds opgavehistorik og kommende opgaver sammen med det,
      // der allerede ligger på koden - og sender resultatet begge veje,
      // så intet kun "kommer med" den ene vej
      await window.__dlhRefreshHistory();
      await window.__dlhRefreshUpcoming();
      startPolling();
    }

    // Laver en kort, tilfældig kode (fx "K7QXM2") - ingen bogstaver/tal der
    // let forveksles (0/O, 1/I/L er udeladt). Koden er bare et "rum" i vores
    // egen lagring, så den behøver ikke bekræftes med en server først.
    function generateCode() {
      var chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
      var code = "";
      for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    createBtn.addEventListener("click", async function () {
      createBtn.disabled = true;
      setStatus("Opretter kode...");
      try {
        await connectWithCode(generateCode());
        // gem den aktuelle rapport med det samme, så koden er klar til den anden enhed
        schedulePush();
      } catch (e) {
        setStatus("Kunne ikke oprette kode (tjek internet)");
      } finally {
        createBtn.disabled = false;
      }
    });

    joinBtn.addEventListener("click", function () {
      var code = elCodeInput.value;
      if (!code.trim()) return;
      connectWithCode(code);
    });

    pullBtn.addEventListener("click", async function () {
      await pullState(true);
      await window.__dlhRefreshHistory();
      await window.__dlhRefreshUpcoming();
    });

    copyBtn.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(syncCode);
        var original = copyBtn.textContent;
        copyBtn.textContent = "✓ Kopieret";
        setTimeout(function () { copyBtn.textContent = original; }, 1600);
      } catch (e) {
        prompt("Kopiér koden manuelt:", syncCode);
      }
    });

    disconnectBtn.addEventListener("click", function () {
      syncCode = null;
      localStorage.removeItem(LS_CODE_KEY);
      if (pollTimer) clearInterval(pollTimer);
      renderConnectionUI();
      setStatus("Ikke forbundet");
    });

    reportFrame.addEventListener("load", function () {
      reportReady = true;
      if (syncCode) {
        pullState(true);
        startPolling();
      }
      // lyt efter ændringer inde i rapporten og gem dem automatisk
      try {
        reportFrame.contentDocument.addEventListener("input", schedulePush);
        reportFrame.contentDocument.addEventListener("click", function (e) {
          if (e.target.closest(".toggle, .photo-btn, .delete-extra, #add-point-btn")) schedulePush();
        });
      } catch (e) {}
    });

    // ---------- opgave-historik (til Opgaveoverblik-fanen) ----------
    var LS_HISTORY_KEY = "dlh-task-history";

    function loadHistoryLocal() {
      try { return JSON.parse(localStorage.getItem(LS_HISTORY_KEY) || "[]"); }
      catch (e) { return []; }
    }

    function saveHistoryLocal(history) {
      localStorage.setItem(LS_HISTORY_KEY, JSON.stringify(history));
    }

    // Slår to historik-lister sammen: nyeste "savedAt" vinder pr. dato
    function mergeHistory(a, b) {
      var map = {};
      (a || []).forEach(function (entry) { map[entry.date] = entry; });
      (b || []).forEach(function (entry) {
        var existing = map[entry.date];
        if (!existing || new Date(entry.savedAt) > new Date(existing.savedAt)) map[entry.date] = entry;
      });
      return Object.keys(map).map(function (k) { return map[k]; })
        .sort(function (x, y) { return (y.date || "").localeCompare(x.date || ""); });
    }

    async function pushHistory(history) {
      if (!syncCode) return;
      try {
        await fetch(SYNC_API + "/" + syncCode + "/history", { method: "PUT", body: JSON.stringify(history) });
      } catch (e) {}
    }

    async function pullHistoryRemote() {
      if (!syncCode) return null;
      try {
        var res = await fetch(SYNC_API + "/" + syncCode + "/history");
        if (res.status === 404) return [];
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; }
    }

    window.__dlhGetHistory = function () { return loadHistoryLocal(); };

    // Gemmer dagens (eller den valgte dato's) opgaver fra rapport-formularen ind i overblikket
    window.__dlhLogToday = async function () {
      var state = getReportState();
      if (!state) return { ok: false };
      var date = (state.meta && state.meta.dato) || new Date().toISOString().slice(0, 10);
      var entry = {
        date: date,
        montor: (state.meta && state.meta.montor) || "",
        items: state.items || [],
        savedAt: new Date().toISOString(),
        tidTotalHours: (state.meta && typeof state.meta.tidTotalHours === "number") ? state.meta.tidTotalHours : null,
        flexDiffHours: (state.meta && typeof state.meta.flexDiffHours === "number") ? state.meta.flexDiffHours : null,
        flexNyHours: (state.meta && typeof state.meta.flexNyHours === "number") ? state.meta.flexNyHours : null
      };
      var history = mergeHistory(loadHistoryLocal(), [entry]);
      saveHistoryLocal(history);
      if (syncCode) await pushHistory(history);

      // Fjern de nu-loggede "Udført"-opgaver fra selve formularen, så de ikke
      // ved et uheld bliver gemt igen (og dermed talt dobbelt) under en senere
      // dato. "Afventer"-opgaver bliver stående som en påmindelse.
      try {
        if (reportFrame.contentWindow.__clearCompletedItems) {
          reportFrame.contentWindow.__clearCompletedItems();
          await pushState();
        }
      } catch (e) {}

      return { ok: true, date: date };
    };

    // Henter nyeste historik fra den delte kode (hvis forbundet), lægger sammen med
    // det lokale, og sender resultatet op igen - så data fra begge enheder når frem,
    // også selvom de blev gemt lokalt, før enhederne var forbundet til hinanden.
    window.__dlhRefreshHistory = async function () {
      var local = loadHistoryLocal();
      if (!syncCode) return local;
      var remote = await pullHistoryRemote();
      if (remote === null) return local;
      var merged = mergeHistory(local, remote);
      saveHistoryLocal(merged);
      await pushHistory(merged);
      return merged;
    };

    // Sletter ét enkelt punkt fra historikken (bruges af Opgaveoverblikkets
    // "✕"-knap, fx til at rydde op i dubletter).
    window.__dlhDeleteHistoryItem = async function (date, idx) {
      var history = loadHistoryLocal();
      var day = history.filter(function (d) { return d.date === date; })[0];
      if (!day || !day.items || idx < 0 || idx >= day.items.length) return;
      day.items.splice(idx, 1);
      saveHistoryLocal(history);
      if (syncCode) await pushHistory(history);
    };

    // Ændrer status på ét enkelt punkt i historikken (bruges af Opgaveoverblikkets
    // "✓ Marker udført"-knap, så en "Afventer"-opgave kan lukkes uden at skulle
    // tilbage i selve rapport-formularen).
    window.__dlhSetHistoryItemStatus = async function (date, idx, status) {
      var history = loadHistoryLocal();
      var day = history.filter(function (d) { return d.date === date; })[0];
      if (!day || !day.items || idx < 0 || idx >= day.items.length) return;
      day.items[idx].status = status;
      saveHistoryLocal(history);
      if (syncCode) await pushHistory(history);
    };

    // ---------- kommende opgaver (til Opgaveoverblik-fanen) ----------
    // Opgaver du allerede nu ved kommer, men som ikke skal på dagens rapport endnu.
    // Deles mellem enheder via samme forbindelseskode som rapporten og historikken.
    var LS_UPCOMING_KEY = "dlh-upcoming-tasks";

    function loadUpcomingLocal() {
      try { return JSON.parse(localStorage.getItem(LS_UPCOMING_KEY) || "[]"); }
      catch (e) { return []; }
    }

    function saveUpcomingLocal(list) {
      localStorage.setItem(LS_UPCOMING_KEY, JSON.stringify(list));
    }

    // Slår to lister sammen: nyeste "updatedAt" vinder pr. opgave-id.
    // Udførte opgaver markeres som "deleted" i stedet for at blive fjernet,
    // så en sletning på én enhed ikke "genopstår" ved næste sync fra en anden.
    function mergeUpcoming(a, b) {
      var map = {};
      (a || []).forEach(function (t) { map[t.id] = t; });
      (b || []).forEach(function (t) {
        var existing = map[t.id];
        if (!existing || new Date(t.updatedAt) > new Date(existing.updatedAt)) map[t.id] = t;
      });
      return Object.keys(map).map(function (k) { return map[k]; });
    }

    async function pushUpcoming(list) {
      if (!syncCode) return;
      try {
        await fetch(SYNC_API + "/" + syncCode + "/upcoming", { method: "PUT", body: JSON.stringify(list) });
      } catch (e) {}
    }

    async function pullUpcomingRemote() {
      if (!syncCode) return null;
      try {
        var res = await fetch(SYNC_API + "/" + syncCode + "/upcoming");
        if (res.status === 404) return [];
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; }
    }

    window.__dlhGetUpcoming = function () {
      return loadUpcomingLocal()
        .filter(function (t) { return !t.deleted; })
        .sort(function (x, y) {
          if (x.dueDate && y.dueDate) return x.dueDate.localeCompare(y.dueDate);
          if (x.dueDate) return -1;
          if (y.dueDate) return 1;
          return (x.createdAt || "").localeCompare(y.createdAt || "");
        });
    };

    // Kommende opgaver der er markeret udført (bruges af Opgaveoverblikkets
    // tælling og dags-liste - se buildCombinedDays)
    window.__dlhGetCompletedUpcoming = function () {
      return loadUpcomingLocal().filter(function (t) { return t.deleted && t.completedAt; });
    };

    window.__dlhAddUpcoming = async function (task) {
      var now = new Date().toISOString();
      var entry = {
        id: "u" + Date.now() + Math.random().toString(36).slice(2, 8),
        title: task.title,
        note: task.note || "",
        dueDate: task.dueDate || "",
        createdAt: now,
        updatedAt: now,
        deleted: false
      };
      var list = loadUpcomingLocal().concat([entry]);
      saveUpcomingLocal(list);
      if (syncCode) await pushUpcoming(list);
      return entry;
    };

    window.__dlhCompleteUpcoming = async function (id) {
      var now = new Date().toISOString();
      var list = loadUpcomingLocal().map(function (t) {
        if (t.id !== id) return t;
        return {
          id: t.id, title: t.title, note: t.note, dueDate: t.dueDate,
          createdAt: t.createdAt, updatedAt: now, deleted: true, completedAt: now
        };
      });
      saveUpcomingLocal(list);
      if (syncCode) await pushUpcoming(list);
    };

    // Fjerner en fuldført kommende opgave helt og permanent fra listen (bruges
    // af Opgaveoverblikkets "✕"-knap) - i modsætning til __dlhCompleteUpcoming,
    // som bare skjuler den, sletter denne den for altid.
    window.__dlhDeleteUpcomingEntry = async function (id) {
      var list = loadUpcomingLocal().filter(function (t) { return t.id !== id; });
      saveUpcomingLocal(list);
      if (syncCode) await pushUpcoming(list);
    };

    // Henter nyeste kommende opgaver fra den delte kode (hvis forbundet), lægger sammen
    // med det lokale, og sender resultatet op igen - samme princip som historikken ovenfor.
    window.__dlhRefreshUpcoming = async function () {
      var local = loadUpcomingLocal();
      if (!syncCode) return local;
      var remote = await pullUpcomingRemote();
      if (remote === null) return local;
      var merged = mergeUpcoming(local, remote);
      saveUpcomingLocal(merged);
      await pushUpcoming(merged);
      return merged;
    };

    // ---------- depotrum / optælling (til Optælling-fanen) ----------
    // Løbende optælling af et par faste ting i depotrummet, med et billede
    // som bevis for hvad der er talt.
    var LS_COUNT_KEY = "dlh-depot-count";

    function loadCountLocal() {
      try { return JSON.parse(localStorage.getItem(LS_COUNT_KEY) || "[]"); }
      catch (e) { return []; }
    }

    function saveCountLocal(list) {
      localStorage.setItem(LS_COUNT_KEY, JSON.stringify(list));
    }

    function mergeCount(a, b) {
      var map = {};
      (a || []).forEach(function (t) { map[t.id] = t; });
      (b || []).forEach(function (t) {
        var existing = map[t.id];
        if (!existing || new Date(t.updatedAt) > new Date(existing.updatedAt)) map[t.id] = t;
      });
      return Object.keys(map).map(function (k) { return map[k]; });
    }

    async function pushCount(list) {
      if (!syncCode) return;
      try {
        await fetch(SYNC_API + "/" + syncCode + "/optaelling", { method: "PUT", body: JSON.stringify(list) });
      } catch (e) {}
    }

    async function pullCountRemote() {
      if (!syncCode) return null;
      try {
        var res = await fetch(SYNC_API + "/" + syncCode + "/optaelling");
        if (res.status === 404) return [];
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; }
    }

    window.__dlhGetCount = function () {
      return loadCountLocal().sort(function (x, y) { return (x.createdAt || "").localeCompare(y.createdAt || ""); });
    };

    window.__dlhAddCountItem = async function (item) {
      var now = new Date().toISOString();
      var entry = {
        id: "c" + Date.now() + Math.random().toString(36).slice(2, 8),
        name: item.name,
        qty: item.qty || 0,
        image: item.image || "",
        createdAt: now,
        updatedAt: now
      };
      var list = loadCountLocal().concat([entry]);
      saveCountLocal(list);
      if (syncCode) await pushCount(list);
      return entry;
    };

    // delta er +1 eller -1 (kan ikke gå under 0)
    window.__dlhAdjustCountQty = async function (id, delta) {
      var list = loadCountLocal().map(function (t) {
        if (t.id !== id) return t;
        return {
          id: t.id, name: t.name, image: t.image, createdAt: t.createdAt,
          qty: Math.max(0, (t.qty || 0) + delta),
          updatedAt: new Date().toISOString()
        };
      });
      saveCountLocal(list);
      if (syncCode) await pushCount(list);
    };

    window.__dlhSetCountImage = async function (id, image) {
      var list = loadCountLocal().map(function (t) {
        if (t.id !== id) return t;
        return {
          id: t.id, name: t.name, qty: t.qty, createdAt: t.createdAt,
          image: image, updatedAt: new Date().toISOString()
        };
      });
      saveCountLocal(list);
      if (syncCode) await pushCount(list);
    };

    window.__dlhDeleteCountItem = async function (id) {
      var list = loadCountLocal().filter(function (t) { return t.id !== id; });
      saveCountLocal(list);
      if (syncCode) await pushCount(list);
    };

    window.__dlhRefreshCount = async function () {
      var local = loadCountLocal();
      if (!syncCode) return local;
      var remote = await pullCountRemote();
      if (remote === null) return local;
      var merged = mergeCount(local, remote);
      saveCountLocal(merged);
      await pushCount(merged);
      return merged;
    };

    renderConnectionUI();
  })();

  // ---------- Optælling-panel (depotrum) ----------
  (function(){
    var panel = document.getElementById("panel-counting");
    var built = false;
    var pendingImage = "";

    function esc(s){
      var d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }

    function formatCountDate(iso){
      if(!iso) return "";
      try{
        var d = new Date(iso);
        return "talt op " + d.toLocaleDateString("da-DK", { day: "numeric", month: "short" }) +
          " kl. " + d.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
      } catch(e){ return ""; }
    }

    // Skalerer billedet ned, før det gemmes, så det ikke fylder for meget i
    // localStorage og ved synkronisering (kameraets originalbillede kan let
    // være flere MB, det behøver det ikke være her).
    function readAndResizeImage(file){
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onerror = reject;
        reader.onload = function(){
          var img = new Image();
          img.onerror = reject;
          img.onload = function(){
            var maxDim = 640;
            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            var w = Math.round(img.width * scale) || 1;
            var h = Math.round(img.height * scale) || 1;
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.6));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function setPreview(dataUrl){
      pendingImage = dataUrl || "";
      var wrap = document.getElementById("cnt-preview");
      var img = document.getElementById("cnt-preview-img");
      var label = document.getElementById("cnt-photo-label");
      if(!wrap) return;
      if(pendingImage){
        img.src = pendingImage;
        wrap.style.display = "flex";
        label.textContent = "Billede valgt";
      } else {
        wrap.style.display = "none";
        label.textContent = "Vælg billede";
      }
    }

    function renderCount(){
      var listEl = document.getElementById("cnt-list");
      if(!listEl) return;
      var items = window.__dlhGetCount ? window.__dlhGetCount() : [];
      document.getElementById("cnt-count").textContent =
        items.length ? (items.length + (items.length === 1 ? " ting" : " ting")) : "";

      if(items.length === 0){
        listEl.innerHTML = '<div class="cnt-empty">Ingen ting talt op endnu. Tilføj dem herover.</div>';
        return;
      }
      var html = "";
      items.forEach(function(item){
        html += '<div class="cnt-item">' +
          (item.image
            ? '<img class="cnt-item-img" src="' + esc(item.image) + '" alt="">'
            : '<div class="cnt-item-img cnt-item-noimg">📦</div>') +
          '<div class="cnt-item-body">' +
            '<div class="cnt-item-name">' + esc(item.name) + '</div>' +
            '<div class="cnt-item-updated">' + esc(formatCountDate(item.updatedAt)) + '</div>' +
          '</div>' +
          '<div class="cnt-item-actions">' +
            '<button class="cnt-step" type="button" data-cnt-adjust="-1" data-id="' + esc(item.id) + '">−</button>' +
            '<span class="cnt-qty">' + item.qty + '</span>' +
            '<button class="cnt-step" type="button" data-cnt-adjust="1" data-id="' + esc(item.id) + '">+</button>' +
            '<label class="cnt-rephoto" title="Skift billede">🖼' +
              '<input type="file" accept="image/*" capture="environment" data-cnt-rephoto data-id="' + esc(item.id) + '" hidden>' +
            '</label>' +
            '<button class="cnt-delete" type="button" data-cnt-delete data-id="' + esc(item.id) + '" title="Slet">✕</button>' +
          '</div>' +
        '</div>';
      });
      listEl.innerHTML = html;
    }

    async function addCountFromForm(){
      var nameEl = document.getElementById("cnt-name");
      var qtyEl = document.getElementById("cnt-qty");
      var name = nameEl.value.trim();
      if(!name){ nameEl.focus(); return; }
      var qty = parseInt(qtyEl.value, 10);
      await window.__dlhAddCountItem({ name: name, qty: isNaN(qty) ? 0 : qty, image: pendingImage });
      nameEl.value = "";
      qtyEl.value = "";
      document.getElementById("cnt-photo-input").value = "";
      setPreview("");
      nameEl.focus();
      renderCount();
    }

    function skeleton(){
      panel.innerHTML =
        '<div class="cnt-wrap">' +
          '<div class="cnt-head">' +
            '<span class="cnt-title">📦 Optælling i depotrum</span>' +
            '<span class="cnt-count" id="cnt-count"></span>' +
          '</div>' +
          '<p class="cnt-hint">Tilføj de ting, I tæller op i depotrummet — navn, antal og gerne et billede.</p>' +
          '<div class="cnt-form">' +
            '<input type="text" id="cnt-name" placeholder="Navn på tingen">' +
            '<input type="number" id="cnt-qty" placeholder="Antal" min="0">' +
            '<label class="cnt-photo-btn">📷 <span id="cnt-photo-label">Vælg billede</span>' +
              '<input type="file" id="cnt-photo-input" accept="image/*" capture="environment" hidden>' +
            '</label>' +
            '<button id="cnt-add-btn" type="button">+ Tilføj</button>' +
          '</div>' +
          '<div class="cnt-preview" id="cnt-preview" style="display:none;">' +
            '<img id="cnt-preview-img" alt="">' +
            '<button type="button" id="cnt-preview-clear">✕</button>' +
          '</div>' +
          '<div class="cnt-list" id="cnt-list"></div>' +
        '</div>';

      document.getElementById("cnt-photo-input").addEventListener("change", async function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        try { setPreview(await readAndResizeImage(file)); }
        catch(err){ setPreview(""); }
      });
      document.getElementById("cnt-preview-clear").addEventListener("click", function(){
        document.getElementById("cnt-photo-input").value = "";
        setPreview("");
      });
      document.getElementById("cnt-add-btn").addEventListener("click", addCountFromForm);
      document.getElementById("cnt-name").addEventListener("keydown", function(e){
        if(e.key === "Enter") addCountFromForm();
      });

      document.getElementById("cnt-list").addEventListener("click", async function(e){
        var delBtn = e.target.closest("[data-cnt-delete]");
        if(delBtn){
          if(!confirm("Slet denne optælling?")) return;
          await window.__dlhDeleteCountItem(delBtn.dataset.id);
          renderCount();
          return;
        }
        var stepBtn = e.target.closest("[data-cnt-adjust]");
        if(stepBtn){
          await window.__dlhAdjustCountQty(stepBtn.dataset.id, parseInt(stepBtn.dataset.cntAdjust, 10));
          renderCount();
        }
      });
      document.getElementById("cnt-list").addEventListener("change", async function(e){
        var input = e.target.closest("[data-cnt-rephoto]");
        if(!input) return;
        var file = input.files && input.files[0];
        if(!file) return;
        try {
          var dataUrl = await readAndResizeImage(file);
          await window.__dlhSetCountImage(input.dataset.id, dataUrl);
          renderCount();
        } catch(err){}
      });
    }

    window.__dlhRenderCounting = async function(){
      if(!built){
        skeleton();
        built = true;
      }
      renderCount();
      var fresh = await window.__dlhRefreshCount();
      if(fresh) renderCount();
    };
  })();

  // ---------- "Gem" knap (gemmer dagens opgaver til Opgaveoverblik) ----------
  document.getElementById("log-today-btn").addEventListener("click", async function(){
    var btn = this;
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = "Gemmer...";
    try{
      var result = await window.__dlhLogToday();
      btn.textContent = (result && result.ok) ? "✓ Gemt" : "⚠ Fejl";
    } catch(e){
      btn.textContent = "⚠ Fejl";
    } finally {
      setTimeout(function(){ btn.textContent = original; btn.disabled = false; }, 1800);
    }
  });

  // ---------- fold synk-detaljer ud/ind ----------
  (function(){
    var toggle = document.getElementById("sync-toggle");
    var panel = document.getElementById("sync-panel");
    toggle.addEventListener("click", function(){
      var isOpen = panel.style.display !== "none";
      panel.style.display = isOpen ? "none" : "block";
      toggle.classList.toggle("expanded", !isOpen);
