  // ---------- Opgaveoverblik-panel ----------
  (function(){
    var panel = document.getElementById("panel-overview");
    var filterStatus = "alle";
    var searchTerm = "";
    var built = false;

    function statusLabel(status){
      if(status === "OK") return "Udført";
      if(status === "AFV") return "Afventer";
      return "Ikke udfyldt";
    }
    function statusClass(status){
      if(status === "OK") return "ok";
      if(status === "AFV") return "afv";
      return "blank";
    }
    function esc(s){
      var d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }
    function formatDate(dateStr){
      if(!dateStr) return "Ukendt dato";
      try{
        var d = new Date(dateStr + "T00:00:00");
        return d.toLocaleDateString("da-DK", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
      } catch(e){ return dateStr; }
    }

    // ---------- ugentligt timeoverblik ----------
    // Samme "t/m"-format som rapportens eget flex-regnskab, bare med fortegn
    // (+/-) valgfrit foran, så flex-tal er lettere at læse i en sum.
    function fmtHours(h, showPlus){
      if(h === null || h === undefined || isNaN(h)) return "—";
      var sign = h < 0 ? "-" : (showPlus && h > 0 ? "+" : "");
      var abs = Math.abs(h);
      var whole = Math.floor(abs);
      var mins = Math.round((abs - whole) * 60);
      if(mins === 60){ whole++; mins = 0; }
      return sign + whole + "t " + (mins < 10 ? "0" + mins : mins) + "m";
    }

    // Beregner ISO-uge (uge starter mandag, uge 1 er ugen med årets første
    // torsdag) for en dato på formen "YYYY-MM-DD".
    function isoWeekInfo(dateStr){
      var d = new Date(dateStr + "T00:00:00");
      var dayIdx = (d.getDay() + 6) % 7; // mandag=0 ... søndag=6
      var monday = new Date(d);
      monday.setDate(d.getDate() - dayIdx);
      var sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      var thursday = new Date(monday);
      thursday.setDate(monday.getDate() + 3);
      var year = thursday.getFullYear();
      var firstThursday = new Date(year, 0, 4);
      var firstThursdayIdx = (firstThursday.getDay() + 6) % 7;
      firstThursday.setDate(firstThursday.getDate() - firstThursdayIdx + 3);
      var week = Math.round((thursday - firstThursday) / (7 * 24 * 3600 * 1000)) + 1;
      return { year: year, week: week, monday: monday, sunday: sunday };
    }

    function formatWeekRange(monday, sunday){
      var mStr = monday.toLocaleDateString("da-DK", { day: "numeric", month: "short" });
      var sStr = sunday.toLocaleDateString("da-DK", { day: "numeric", month: "short", year: "numeric" });
      return mStr + " – " + sStr;
    }

    // Lægger dagenes gemte timetal sammen pr. uge. Kun dage, hvor rapporten
    // faktisk har regnet et timetal ud (tidTotalHours/flexDiffHours), tæller
    // med - ældre historik fra før dette blev gemt, springes bare over.
    function buildWeekOverview(){
      var history = window.__dlhGetHistory ? window.__dlhGetHistory() : [];
      var weeks = {};
      history.forEach(function(day){
        if(typeof day.tidTotalHours !== "number" && typeof day.flexDiffHours !== "number") return;
        var info = isoWeekInfo(day.date);
        var key = info.year + "-W" + (info.week < 10 ? "0" + info.week : info.week);
        if(!weeks[key]){
          weeks[key] = {
            key: key, week: info.week, monday: info.monday, sunday: info.sunday,
            totalHours: 0, flexHours: 0, latestDate: null, latestFlexNy: null
          };
        }
        var w = weeks[key];
        if(typeof day.tidTotalHours === "number") w.totalHours += day.tidTotalHours;
        if(typeof day.flexDiffHours === "number") w.flexHours += day.flexDiffHours;
        if(typeof day.flexNyHours === "number" && (!w.latestDate || day.date > w.latestDate)){
          w.latestDate = day.date;
          w.latestFlexNy = day.flexNyHours;
        }
      });
      return Object.keys(weeks).map(function(k){ return weeks[k]; })
        .sort(function(a, b){ return b.key.localeCompare(a.key); });
    }

    function renderWeekOverview(){
      var listEl = document.getElementById("ov-week-list");
      if(!listEl) return;
      var weeks = buildWeekOverview();
      if(weeks.length === 0){
        listEl.innerHTML = '<div class="ov-week-empty">Ingen timetal endnu — udfyld mødetid/sluttid i rapporten og tryk "Gem", så dukker ugerne op her.</div>';
        return;
      }
      var html = "";
      weeks.forEach(function(w){
        html += '<div class="ov-week-row">' +
          '<div class="ov-week-label">Uge ' + w.week + ' · ' + esc(formatWeekRange(w.monday, w.sunday)) + '</div>' +
          '<div class="ov-week-stats">' +
            '<div><span>Arbejdstid</span><b>' + esc(fmtHours(w.totalHours, false)) + '</b></div>' +
            '<div><span>Flex denne uge</span><b>' + esc(fmtHours(w.flexHours, true)) + '</b></div>' +
            '<div><span>Flexsaldo</span><b>' + esc(w.latestFlexNy !== null ? fmtHours(w.latestFlexNy, true) : "—") + '</b></div>' +
          '</div>' +
        '</div>';
      });
      listEl.innerHTML = html;
    }

    function formatDueDate(dateStr){
      if(!dateStr) return "";
      try{
        var d = new Date(dateStr + "T00:00:00");
        return d.toLocaleDateString("da-DK", { day:"numeric", month:"short", year:"numeric" });
      } catch(e){ return dateStr; }
    }

    function renderUpcoming(){
      var listEl = document.getElementById("ov-upcoming-list");
      if(!listEl) return;
      var list = window.__dlhGetUpcoming ? window.__dlhGetUpcoming() : [];
      document.getElementById("ov-upcoming-count").textContent =
        list.length ? (list.length + (list.length === 1 ? " opgave" : " opgaver")) : "";

      if(list.length === 0){
        listEl.innerHTML = '<div class="ov-upcoming-empty">Ingen kommende opgaver endnu — tilføj dem, du allerede ved kommer.</div>';
        return;
      }
      var html = "";
      list.forEach(function(t){
        html += '<div class="ov-upcoming-item">' +
          '<div><div class="ov-upcoming-item-title">' + esc(t.title) + '</div>' +
          (t.note ? '<div class="ov-upcoming-item-desc">' + esc(t.note) + '</div>' : '') +
          (t.dueDate ? '<div class="ov-upcoming-item-date">' + esc(formatDueDate(t.dueDate)) + '</div>' : '') +
          '</div>' +
          '<button class="ov-upcoming-done-btn" data-done-id="' + esc(t.id) + '" type="button">✓ Udført</button>' +
        '</div>';
      });
      listEl.innerHTML = html;
    }

    async function addUpcomingFromForm(){
      var titleEl = document.getElementById("ov-upcoming-title");
      var noteEl = document.getElementById("ov-upcoming-note");
      var dateEl = document.getElementById("ov-upcoming-date");
      var title = titleEl.value.trim();
      if(!title){ titleEl.focus(); return; }
      await window.__dlhAddUpcoming({ title: title, note: noteEl.value.trim(), dueDate: dateEl.value });
      titleEl.value = "";
      noteEl.value = "";
      dateEl.value = "";
      titleEl.focus();
      renderUpcoming();
    }

    function skeleton(){
      panel.innerHTML =
        '<div class="ov-wrap">' +
          '<div class="ov-upcoming">' +
            '<div class="ov-upcoming-head">' +
              '<span class="ov-upcoming-title">📌 Kommende opgaver</span>' +
              '<span class="ov-upcoming-count" id="ov-upcoming-count"></span>' +
            '</div>' +
            '<div class="ov-upcoming-form">' +
              '<input type="text" id="ov-upcoming-title" placeholder="Hvad skal laves?">' +
              '<input type="text" id="ov-upcoming-note" placeholder="Note (valgfri)">' +
              '<input type="date" id="ov-upcoming-date">' +
              '<button id="ov-upcoming-add-btn" type="button">+ Tilføj</button>' +
            '</div>' +
            '<div class="ov-upcoming-list" id="ov-upcoming-list"></div>' +
          '</div>' +
          '<div class="ov-summary">' +
            '<div class="ov-stat"><b id="ov-total">0</b><span>Opgaver i alt</span></div>' +
            '<div class="ov-stat ok"><b id="ov-ok">0</b><span>Udført</span></div>' +
            '<div class="ov-stat afv"><b id="ov-afv">0</b><span>Afventer</span></div>' +
            '<div class="ov-stat"><b id="ov-days">0</b><span>Dage logget</span></div>' +
          '</div>' +
          '<div class="ov-week">' +
            '<div class="ov-week-title">🗓️ Ugentligt timeoverblik</div>' +
            '<div id="ov-week-list"></div>' +
          '</div>' +
          '<div class="ov-controls">' +
            '<input class="ov-search" id="ov-search" placeholder="Søg i opgaver, beskrivelse, ansvarlig...">' +
            '<div class="ov-filter" id="ov-filter">' +
              '<button data-f="alle" class="active">Alle</button>' +
              '<button data-f="OK">Udført</button>' +
              '<button data-f="AFV">Afventer</button>' +
              '<button data-f="">Ikke udfyldt</button>' +
            '</div>' +
            '<button class="ov-refresh" id="ov-refresh">🔄 Opdater</button>' +
          '</div>' +
          '<div id="ov-list"></div>' +
        '</div>';

      document.getElementById("ov-upcoming-add-btn").addEventListener("click", addUpcomingFromForm);
      document.getElementById("ov-upcoming-title").addEventListener("keydown", function(e){
        if(e.key === "Enter") addUpcomingFromForm();
      });
      document.getElementById("ov-upcoming-note").addEventListener("keydown", function(e){
        if(e.key === "Enter") addUpcomingFromForm();
      });
      document.getElementById("ov-upcoming-list").addEventListener("click", async function(e){
        var btn = e.target.closest("[data-done-id]");
        if(!btn) return;
        btn.disabled = true;
        btn.textContent = "...";
        await window.__dlhCompleteUpcoming(btn.dataset.doneId);
        renderUpcoming();
        renderList();
      });

      document.getElementById("ov-search").addEventListener("input", function(){
        searchTerm = this.value.toLowerCase();
        renderList();
      });
      document.getElementById("ov-filter").addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        filterStatus = b.dataset.f;
        panel.querySelectorAll(".ov-filter button").forEach(function(x){ x.classList.remove("active"); });
        b.classList.add("active");
        renderList();
      });
      document.getElementById("ov-refresh").addEventListener("click", async function(){
        var btn = this;
        btn.textContent = "Henter...";
        await window.__dlhRefreshHistory();
        renderList();
        btn.textContent = "🔄 Opdater";
      });
      document.getElementById("ov-list").addEventListener("click", async function(e){
        var doneBtn = e.target.closest(".ov-task-done");
        if(doneBtn){
          doneBtn.disabled = true;
          await window.__dlhSetHistoryItemStatus(doneBtn.dataset.date, parseInt(doneBtn.dataset.idx, 10), "OK");
          renderList();
          return;
        }
        var btn = e.target.closest(".ov-task-delete");
        if(!btn) return;
        if(!confirm("Slet denne opgave permanent? Det kan ikke fortrydes.")) return;
        btn.disabled = true;
        if(btn.dataset.upid){
          await window.__dlhDeleteUpcomingEntry(btn.dataset.upid);
        } else {
          await window.__dlhDeleteHistoryItem(btn.dataset.date, parseInt(btn.dataset.idx, 10));
        }
        renderList();
      });
    }

    // Lægger fuldførte kommende opgaver ind i dags-oversigten (under den dato,
    // de blev markeret udført), uden at røre den gemte rapport-historik - så
    // de tæller med i "Opgaver i alt"/"Udført" og "Dage logget", men en
    // efterfølgende "Gem" af rapporten kan ikke overskrive dem.
    function buildCombinedDays(){
      var history = window.__dlhGetHistory ? window.__dlhGetHistory() : [];
      var completedUpcoming = window.__dlhGetCompletedUpcoming ? window.__dlhGetCompletedUpcoming() : [];

      var byDate = {};
      history.forEach(function(day){
        // _historyIdx husker punktets plads i den gemte historik, så vi ved
        // præcis hvad der skal slettes, hvis man trykker "✕" på det.
        var items = (day.items || []).map(function(it, i){
          var copy = {};
          for(var k in it){ copy[k] = it[k]; }
          copy._historyIdx = i;
          return copy;
        });
        byDate[day.date] = { date: day.date, montor: day.montor, items: items };
      });
      completedUpcoming.forEach(function(t){
        var d = (t.completedAt || "").slice(0, 10);
        if(!d) return;
        if(!byDate[d]) byDate[d] = { date: d, montor: "", items: [] };
        byDate[d].items.push({
          emne: t.title, krav: t.note || "", status: "OK", ansvarlig: "", anmaerkning: "",
          _upcomingId: t.id
        });
      });

      return Object.keys(byDate).map(function(k){ return byDate[k]; })
        .sort(function(x, y){ return (y.date || "").localeCompare(x.date || ""); });
    }

    function renderList(){
      var history = buildCombinedDays();
      var totalTasks = 0, okCount = 0, afvCount = 0;
      var listEl = document.getElementById("ov-list");
      var html = "";

      history.forEach(function(day){
        var items = (day.items || []).filter(function(it){
          totalTasks++;
          if(it.status === "OK") okCount++;
          if(it.status === "AFV") afvCount++;
          return true;
        });
      });

      var filteredDays = history.map(function(day){
        var items = (day.items || []).filter(function(it){
          if(filterStatus !== "alle" && (it.status || "") !== filterStatus) return false;
          if(searchTerm){
            var hay = ((it.emne||"") + " " + (it.krav||"") + " " + (it.ansvarlig||"") + " " + (it.anmaerkning||"")).toLowerCase();
            if(hay.indexOf(searchTerm) === -1) return false;
          }
          return true;
        });
        return { day: day, items: items };
      }).filter(function(d){ return d.items.length > 0; });

      document.getElementById("ov-total").textContent = totalTasks;
      document.getElementById("ov-ok").textContent = okCount;
      document.getElementById("ov-afv").textContent = afvCount;
      document.getElementById("ov-days").textContent = history.length;

      if(filteredDays.length === 0){
        listEl.innerHTML = '<div class="ov-empty">' +
          (history.length === 0
            ? 'Ingen opgaver logget endnu. Gå til Rapport-fanen, udfyld dagens opgaver, og tryk "Gem dagens opgaver".'
            : 'Ingen opgaver matcher din søgning/filter.') +
          '</div>';
        return;
      }

      filteredDays.forEach(function(d){
        html += '<div class="ov-day">' +
          '<div class="ov-day-head">' +
            '<span class="ov-day-date">' + esc(formatDate(d.day.date)) + '</span>' +
            (d.day.montor ? '<span class="ov-day-meta">· ' + esc(d.day.montor) + '</span>' : '') +
          '</div>';
        d.items.forEach(function(it){
          var delAttrs = it._upcomingId
            ? ' data-upid="' + esc(it._upcomingId) + '"'
            : ' data-date="' + esc(d.day.date) + '" data-idx="' + it._historyIdx + '"';
          // Kun rigtige historik-punkter (ikke fuldførte kommende opgaver, som
          // altid allerede er "Udført") kan skifte status direkte herfra.
          var doneAttrs = ' data-date="' + esc(d.day.date) + '" data-idx="' + it._historyIdx + '"';
          html += '<div class="ov-task">' +
            '<div class="ov-task-top">' +
              '<div><div class="ov-task-title">' + esc(it.emne || "Uden titel") + '</div>' +
              (it.krav ? '<div class="ov-task-desc">' + esc(it.krav) + '</div>' : '') + '</div>' +
              '<div class="ov-task-actions">' +
                '<span class="ov-pill ' + statusClass(it.status) + '">' + statusLabel(it.status) + '</span>' +
                (it.status === "AFV" && !it._upcomingId
                  ? '<button class="ov-task-done" type="button"' + doneAttrs + ' title="Marker udført">✓ Udført</button>'
                  : '') +
                '<button class="ov-task-delete" type="button"' + delAttrs + ' title="Slet opgave">✕</button>' +
              '</div>' +
            '</div>' +
            (it.ansvarlig || it.anmaerkning
              ? '<div class="ov-task-note">' +
                (it.ansvarlig ? '<b>Ansvarlig:</b> ' + esc(it.ansvarlig) + ' ' : '') +
                (it.anmaerkning ? '<div>' + esc(it.anmaerkning) + '</div>' : '') +
                '</div>'
              : '') +
            '</div>';
        });
        html += '</div>';
      });

      listEl.innerHTML = html;
    }

    window.__dlhRenderOverview = async function(){
      if(!built){
        skeleton();
        built = true;
      }
      renderList();
      renderUpcoming();
      renderWeekOverview();
      // opdater stille i baggrunden, hvis der er en forbindelseskode
      var freshHistory = await window.__dlhRefreshHistory();
      if(freshHistory){ renderList(); renderWeekOverview(); }
      var freshUpcoming = await window.__dlhRefreshUpcoming();
      if(freshUpcoming) renderUpcoming();
    };
  })();
</script>
